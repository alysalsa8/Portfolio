<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forest Pac-Man</title>
  <!-- Run this file with: python3 -m http.server 8000 (or npx serve -l 8000), then open http://localhost:8000 -->
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #04070a;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #score {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      font-family: sans-serif;
      font-size: 20px;
      color: #dfe7ff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      user-select: none;
    }
    #hint {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 10;
      font-family: sans-serif;
      font-size: 13px;
      color: #9fb0c9;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      user-select: none;
    }
    #win {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 64px;
      font-weight: bold;
      color: #dfe7ff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="score">Collected: 0 / 10</div>
  <div id="hint">WASD / arrows to move &middot; drag mouse to look around</div>
  <div id="win">You win</div>
  <script type="module">
    import * as THREE from 'three';

    // Setup renderer
    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Setup scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050a07);
    scene.fog = new THREE.Fog(0x050a07, 18, 65);

    // Setup camera
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      300
    );
    camera.position.set(0, 8, 12);
    camera.lookAt(0, 0, 0);

    // Setup lighting
    const ambientLight = new THREE.AmbientLight(0x3a4a30, 0.55);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xcfe6ff, 1.1);
    directionalLight.position.set(10, 20, 10);
    scene.add(directionalLight);

    // Ground plane (forest floor)
    const groundGeometry = new THREE.PlaneGeometry(100, 100);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x1c2b15,
      roughness: 0.95
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    // Constants
    const PLAYER_RADIUS = 0.5;
    const TOTAL_GHOSTS = 10;
    const SPAWN_RANGE = 20;
    const MOVE_SPEED = 8;
    const GHOST_SPEED = 3;
    const GHOST_RADIUS = 0.55;
    const GHOST_TURN_MIN = 1.5;
    const GHOST_TURN_MAX = 3.5;
    const COLLECT_DISTANCE = 1.25;
    const COLLECT_DISTANCE_SQ = COLLECT_DISTANCE * COLLECT_DISTANCE;
    const PLAY_BOUND = 24;

    const OBSTACLE_RANGE = 22;
    const CLEAR_ZONE = 5;
    const TREE_COUNT = 14;
    const BUSH_COUNT = 10;
    const TREE_RADIUS = 0.55;
    const BUSH_RADIUS = 1.0;

    const CAMERA_DISTANCE = Math.hypot(8, 12);
    const CAMERA_LERP = 5;
    const MIN_PITCH = 0.15;
    const MAX_PITCH = 1.45;
    const DRAG_SENSITIVITY = 0.008;

    // State
    let score = 0;
    let gameOver = false;
    const clock = new THREE.Clock();
    const keys = {};
    const moveDir = new THREE.Vector3();
    const desiredCamPos = new THREE.Vector3();
    let playerFacing = 0;
    let chompTimer = 0;
    let chompOpen = false;

    let cameraYaw = 0;
    let cameraPitch = Math.atan2(8, 12);
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    // DOM overlay
    const scoreEl = document.getElementById('score');
    const winEl = document.getElementById('win');
    function updateScoreUI() {
      scoreEl.textContent = `Collected: ${score} / ${TOTAL_GHOSTS}`;
    }
    updateScoreUI();

    // Obstacles: trees and bushes scattered across the forest floor
    const obstacles = [];

    const trunkGeometry = new THREE.CylinderGeometry(0.18, 0.24, 1.4, 8);
    const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x4a3323, roughness: 0.9 });
    const foliageGeometry = new THREE.ConeGeometry(1.3, 2.2, 8);
    const foliageMaterial = new THREE.MeshStandardMaterial({ color: 0x1f5c2e, roughness: 0.85 });
    const bushGeometry = new THREE.SphereGeometry(1, 10, 8);
    const bushMaterial = new THREE.MeshStandardMaterial({ color: 0x2d6a34, roughness: 0.9 });

    function farEnoughFromObstacles(x, z, radius, buffer) {
      for (const obs of obstacles) {
        const minDist = radius + obs.radius + buffer;
        if (Math.hypot(x - obs.position.x, z - obs.position.z) < minDist) return false;
      }
      return true;
    }

    function pickObstaclePosition(radius) {
      let x, z, attempts = 0, ok;
      do {
        x = (Math.random() * 2 - 1) * OBSTACLE_RANGE;
        z = (Math.random() * 2 - 1) * OBSTACLE_RANGE;
        ok = Math.hypot(x, z) >= CLEAR_ZONE && farEnoughFromObstacles(x, z, radius, 0.8);
        attempts++;
      } while (!ok && attempts < 30);
      return { x, z };
    }

    function spawnTree() {
      const { x, z } = pickObstaclePosition(TREE_RADIUS);
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
      trunk.position.y = 0.7;
      const foliage = new THREE.Mesh(foliageGeometry, foliageMaterial);
      foliage.position.y = 2.3;
      group.add(trunk);
      group.add(foliage);
      group.position.set(x, 0, z);
      scene.add(group);
      obstacles.push({ position: group.position, radius: TREE_RADIUS });
    }

    function spawnBush() {
      const { x, z } = pickObstaclePosition(BUSH_RADIUS);
      const bush = new THREE.Mesh(bushGeometry, bushMaterial);
      bush.scale.set(1, 0.65, 1);
      bush.position.set(x, 0.62, z);
      scene.add(bush);
      obstacles.push({ position: bush.position, radius: BUSH_RADIUS });
    }

    function spawnObstacles() {
      for (let i = 0; i < TREE_COUNT; i++) spawnTree();
      for (let i = 0; i < BUSH_COUNT; i++) spawnBush();
    }
    spawnObstacles();

    // Player: Pac-Man style sphere with a wedge mouth that faces movement direction
    const MOUTH_CLOSED_HALF_ANGLE = 0.16;
    const MOUTH_OPEN_HALF_ANGLE = 0.65;

    function makePacGeometry(halfAngle) {
      const geo = new THREE.SphereGeometry(
        PLAYER_RADIUS, 32, 32,
        halfAngle, Math.PI * 2 - halfAngle * 2
      );
      geo.rotateY(Math.PI / 2);
      return geo;
    }
    const pacGeoClosed = makePacGeometry(MOUTH_CLOSED_HALF_ANGLE);
    const pacGeoOpen = makePacGeometry(MOUTH_OPEN_HALF_ANGLE);

    const player = new THREE.Mesh(
      pacGeoClosed,
      new THREE.MeshStandardMaterial({
        color: 0xffe234,
        emissive: 0x8a6f00,
        emissiveIntensity: 0.6,
        roughness: 0.35,
        side: THREE.DoubleSide
      })
    );
    player.position.set(0, PLAYER_RADIUS, 0);
    scene.add(player);

    const playerLight = new THREE.PointLight(0xffe234, 1.6, 12);
    player.add(playerLight);

    // Ghosts: capsule bodies with eyes, wandering the forest
    const ghostColors = [0xff2d2d, 0xffb8ff, 0x00e5ff, 0xffa237];
    const ghostBodyGeometry = new THREE.CapsuleGeometry(0.45, 0.5, 8, 16);
    const eyeWhiteGeometry = new THREE.SphereGeometry(0.12, 12, 12);
    const eyePupilGeometry = new THREE.SphereGeometry(0.06, 8, 8);
    const eyeWhiteMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
    const eyePupilMaterial = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.6 });

    const ghosts = [];

    function pickGhostSpawn() {
      let x, z, attempts = 0, ok;
      do {
        x = (Math.random() * 2 - 1) * SPAWN_RANGE;
        z = (Math.random() * 2 - 1) * SPAWN_RANGE;
        ok = Math.hypot(x, z) >= 4 && farEnoughFromObstacles(x, z, GHOST_RADIUS, 0.5);
        if (ok) {
          for (const g of ghosts) {
            if (Math.hypot(x - g.position.x, z - g.position.z) < 2.5) {
              ok = false;
              break;
            }
          }
        }
        attempts++;
      } while (!ok && attempts < 30);
      return { x, z };
    }

    function spawnGhosts() {
      for (let i = 0; i < TOTAL_GHOSTS; i++) {
        const { x, z } = pickGhostSpawn();
        const color = ghostColors[i % ghostColors.length];

        const group = new THREE.Group();
        const body = new THREE.Mesh(
          ghostBodyGeometry,
          new THREE.MeshStandardMaterial({
            color,
            emissive: color,
            emissiveIntensity: 0.45,
            roughness: 0.5
          })
        );
        group.add(body);

        const eyeL = new THREE.Mesh(eyeWhiteGeometry, eyeWhiteMaterial);
        eyeL.position.set(-0.16, 0.15, 0.38);
        const eyeR = new THREE.Mesh(eyeWhiteGeometry, eyeWhiteMaterial);
        eyeR.position.set(0.16, 0.15, 0.38);
        const pupilL = new THREE.Mesh(eyePupilGeometry, eyePupilMaterial);
        pupilL.position.set(-0.16, 0.15, 0.46);
        const pupilR = new THREE.Mesh(eyePupilGeometry, eyePupilMaterial);
        pupilR.position.set(0.16, 0.15, 0.46);
        group.add(eyeL, eyeR, pupilL, pupilR);

        group.position.set(x, 0.7, z);
        group.userData.angle = Math.random() * Math.PI * 2;
        group.userData.turnTimer = GHOST_TURN_MIN + Math.random() * (GHOST_TURN_MAX - GHOST_TURN_MIN);
        scene.add(group);
        ghosts.push(group);
      }
    }
    spawnGhosts();

    // Input handling
    const arrowCodes = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (arrowCodes.has(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Mouse-drag orbit camera
    renderer.domElement.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      cameraYaw -= dx * DRAG_SENSITIVITY;
      cameraPitch = Math.max(MIN_PITCH, Math.min(MAX_PITCH, cameraPitch - dy * DRAG_SENSITIVITY));
    });
    renderer.domElement.addEventListener('pointerup', () => { isDragging = false; });
    renderer.domElement.addEventListener('pointercancel', () => { isDragging = false; });

    function resolveObstacleCollisions(position, radius) {
      for (const obs of obstacles) {
        const dx = position.x - obs.position.x;
        const dz = position.z - obs.position.z;
        const minDist = radius + obs.radius;
        const distSq = dx * dx + dz * dz;
        if (distSq < minDist * minDist && distSq > 1e-8) {
          const dist = Math.sqrt(distSq);
          const push = minDist - dist;
          position.x += (dx / dist) * push;
          position.z += (dz / dist) * push;
        }
      }
    }

    function updatePlayer(dt) {
      moveDir.set(0, 0, 0);
      if (keys['KeyW'] || keys['ArrowUp']) moveDir.z -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) moveDir.z += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveDir.x -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) moveDir.x += 1;

      const moving = moveDir.lengthSq() > 0;
      if (moving) {
        moveDir.normalize();
        player.position.x += moveDir.x * MOVE_SPEED * dt;
        player.position.z += moveDir.z * MOVE_SPEED * dt;
        playerFacing = Math.atan2(moveDir.x, moveDir.z);
      }
      player.rotation.y = playerFacing;

      resolveObstacleCollisions(player.position, PLAYER_RADIUS);

      player.position.x = Math.max(-PLAY_BOUND, Math.min(PLAY_BOUND, player.position.x));
      player.position.z = Math.max(-PLAY_BOUND, Math.min(PLAY_BOUND, player.position.z));

      // Chomping mouth animation
      if (moving) {
        chompTimer -= dt;
        if (chompTimer <= 0) {
          chompOpen = !chompOpen;
          chompTimer = 0.12;
          player.geometry = chompOpen ? pacGeoOpen : pacGeoClosed;
        }
      } else if (chompOpen) {
        chompOpen = false;
        player.geometry = pacGeoClosed;
      }
    }

    function pickNewGhostDirection(ghost) {
      ghost.userData.angle = Math.random() * Math.PI * 2;
      ghost.userData.turnTimer = GHOST_TURN_MIN + Math.random() * (GHOST_TURN_MAX - GHOST_TURN_MIN);
    }

    function updateGhosts(dt) {
      for (const ghost of ghosts) {
        ghost.userData.turnTimer -= dt;
        if (ghost.userData.turnTimer <= 0) pickNewGhostDirection(ghost);

        const dirX = Math.sin(ghost.userData.angle);
        const dirZ = Math.cos(ghost.userData.angle);
        const nx = ghost.position.x + dirX * GHOST_SPEED * dt;
        const nz = ghost.position.z + dirZ * GHOST_SPEED * dt;

        let blocked = Math.abs(nx) > PLAY_BOUND || Math.abs(nz) > PLAY_BOUND;
        if (!blocked) {
          for (const obs of obstacles) {
            const minDist = GHOST_RADIUS + obs.radius;
            if (Math.hypot(nx - obs.position.x, nz - obs.position.z) < minDist) {
              blocked = true;
              break;
            }
          }
        }

        if (blocked) {
          pickNewGhostDirection(ghost);
        } else {
          ghost.position.x = nx;
          ghost.position.z = nz;
          ghost.rotation.y = ghost.userData.angle;
        }
      }
    }

    function updateCamera(dt) {
      const offsetX = CAMERA_DISTANCE * Math.sin(cameraYaw) * Math.cos(cameraPitch);
      const offsetY = CAMERA_DISTANCE * Math.sin(cameraPitch);
      const offsetZ = CAMERA_DISTANCE * Math.cos(cameraYaw) * Math.cos(cameraPitch);
      desiredCamPos.set(
        player.position.x + offsetX,
        player.position.y + offsetY,
        player.position.z + offsetZ
      );
      const alpha = 1 - Math.exp(-CAMERA_LERP * dt);
      camera.position.lerp(desiredCamPos, alpha);
      camera.lookAt(player.position);
    }

    function triggerWin() {
      gameOver = true;
      winEl.style.display = 'flex';
      for (const k in keys) keys[k] = false;
    }

    function checkCollisions() {
      for (let i = ghosts.length - 1; i >= 0; i--) {
        const ghost = ghosts[i];
        const distSq = player.position.distanceToSquared(ghost.position);
        if (distSq < COLLECT_DISTANCE_SQ) {
          scene.remove(ghost);
          ghosts.splice(i, 1);
          score++;
          updateScoreUI();
        }
      }
      if (score >= TOTAL_GHOSTS && !gameOver) {
        triggerWin();
      }
    }

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (!gameOver) {
        updatePlayer(dt);
        updateGhosts(dt);
        checkCollisions();
      }

      updateCamera(dt);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
